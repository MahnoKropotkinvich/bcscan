metadata:
  name: "large-value-transfer"
  version: "1.2"
  author: "security-team"
  description: "检测大额 ETH 转账交易（> 5 ETH）"
  tags: ["transfer", "high", "monitoring"]
  enabled: true

config:
  severity: "high"
  priority: 50
  throttle:
    enabled: false
  hooks:
    - "contract_function_call"

triggers:
  operator: "AND"
  conditions:
    - type: "value"
      operator: ">"
      value: 5.0e18  # > 5 ETH (in wei)
      description: "转账金额超过 5 ETH"

scoring:
  base_score: 60
  factors:
    - condition: "value > 1.0e19"  # > 10 ETH
      score: 20
      description: "超大额转账（> 10 ETH）"
    - condition: "value > 2.0e19"  # > 20 ETH
      score: 15
      description: "巨额转账（> 20 ETH）"

actions:
  - type: "alert"
    severity: "high"
    title: "检测到大额转账"
    message: "交易 {{tx_hash}} 转账金额超过 5 ETH"

  - type: "log_risk_event"
    severity: "high"
